# Publishes the documentation site (apps/docs) on GitHub Pages at https://kouga00.github.io/opentax-it/.
# Needs Settings → Pages → Source: "GitHub Actions". Structure from the GitHub docs, "Using custom workflows with
# GitHub Pages": a build job that uploads the site and a deploy job with pages and id-token write permissions.
name: Docs
on:
  push:
    branches: [main]
    # The pages come from docs/, the API reference from the controllers and DTOs of the API.
    paths:
      - docs/**
      - apps/docs/**
      - apps/api/src/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
# One publication at a time; a running one is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # Node LTS
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build # the API, compiled for the OpenAPI document, imports them from dist/
      - run: pnpm --filter @opentax-it/docs build # OpenAPI document of the API, API pages and site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
