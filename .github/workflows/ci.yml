name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # Node LTS
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils # xmllint for XSD validation tests
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opentax-it/api run prisma:generate # the Prisma client is generated, not committed; tests import it
      - run: pnpm --filter "./packages/**" build # workspace packages resolve to dist/, needed by the API tests and type-aware lint
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
